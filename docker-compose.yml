# Stack de production Communeo V2 (#179). Images publiées par .github/workflows/deploy.yml sur GHCR ;
# `IMAGE_TAG` choisit la version (commit), `latest` par défaut. `build:` sert aux essais en local.
# Déploiement, sauvegardes, supervision, retour arrière : DEPLOYMENT.md et PRODUCTION.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  strapi:
    image: ${IMAGE_REGISTRY:-ghcr.io/philippe-tic}/communeo-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      IS_PROXIED: "true"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      # Chiffrement des tokens d'API dans la base (admin Strapi)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      PREVIEW_API_TOKEN: ${PREVIEW_API_TOKEN}
      STRAPI_PUBLIC_URL: https://${DOMAIN}
      NETLIFY_TOKEN: ${NETLIFY_TOKEN}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      # Émetteur des devis (#312) et des factures (#314)
      COMMUNEO_LEGAL_NAME: ${COMMUNEO_LEGAL_NAME:-}
      COMMUNEO_LEGAL_ADDRESS: ${COMMUNEO_LEGAL_ADDRESS:-}
      COMMUNEO_SIRET: ${COMMUNEO_SIRET:-}
      COMMUNEO_BILLING_EMAIL: ${COMMUNEO_BILLING_EMAIL:-}
      COMMUNEO_VAT_RATE: ${COMMUNEO_VAT_RATE:-0}
      COMMUNEO_IBAN: ${COMMUNEO_IBAN:-}
      COMMUNEO_BIC: ${COMMUNEO_BIC:-}
      # File des builds (schéma pgboss de la même base), traitée par le service worker
      QUEUE_DATABASE_URL: postgres://strapi:${POSTGRES_PASSWORD}@postgres:5432/strapi
      WORKER_SECRET: ${WORKER_SECRET}
      # Jetons de preview signés (même secret côté serveur de preview)
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      PREVIEW_URL: https://${PREVIEW_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-noreply@communeo.fr}
      # Équipe : inscriptions, passages en live, formulaire de contact de communeo.fr
      SIGNUP_NOTIFY_EMAIL: ${SIGNUP_NOTIFY_EMAIL:-}
      # Adresses de test de l'équipe (inscription sans écrire à la vraie mairie)
      SIGNUP_TEST_EMAILS: ${SIGNUP_TEST_EMAILS:-}
      # Hébergeur affiché dans les mentions légales de chaque commune (config/platform.ts)
      HOSTING_NAME: ${HOSTING_NAME:-}
      HOSTING_ADDRESS: ${HOSTING_ADDRESS:-}
      HOSTING_PHONE: ${HOSTING_PHONE:-}
      ADMIN_URL: https://${DOMAIN}
      DOMAIN: ${DOMAIN}
      # Seed initial admin (first boot only, optional)
      SEED_SITE_NAME: ${SEED_SITE_NAME:-}
      SEED_SITE_SLUG: ${SEED_SITE_SLUG:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
    volumes:
      - strapi-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1337/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/philippe-tic}/communeo-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      strapi:
        condition: service_healthy
    environment:
      QUEUE_DATABASE_URL: postgres://strapi:${POSTGRES_PASSWORD}@postgres:5432/strapi
      STRAPI_URL: http://strapi:1337
      STRAPI_PUBLIC_URL: https://${DOMAIN}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      WORKER_SECRET: ${WORKER_SECRET}
      NETLIFY_TOKEN: ${NETLIFY_TOKEN}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      # Sans NETLIFY_TOKEN : sites écrits dans le volume `sites`, servis par Caddy (origine des sites, #381),
      # rechargé après chaque publication par son API d'administration (réseau interne)
      PUBLISH_DIR: /srv/sites
      PUBLISH_BASE_URL: https://${ORIGIN_DOMAIN:-origine.communeo.fr}/sites
      CADDY_ADMIN_URL: http://caddy:2019
    volumes:
      - sites:/srv/sites
    # Deux cœurs sur quatre : un build ne ralentit ni l'admin ni l'API
    cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  preview:
    image: ${IMAGE_REGISTRY:-ghcr.io/philippe-tic}/communeo-preview:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_started
    environment:
      STRAPI_URL: http://strapi:1337
      STRAPI_PUBLIC_URL: https://${DOMAIN}
      # Lecture seule, brouillons compris (« Preview Token » créé au premier démarrage de Strapi)
      STRAPI_TOKEN: ${PREVIEW_API_TOKEN}
      # Vérifie les jetons délivrés par Strapi : sans lui, tout répond 401
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      # Affichée dans le panneau de preview de l'administration seulement
      PREVIEW_FRAME_ANCESTORS: https://${DOMAIN}
    healthcheck:
      # Sans jeton, la preview répond 401 : toute réponse HTTP prouve que le serveur tourne
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:4321/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Image « web » (apps/admin/Dockerfile) : admin compilée + Caddy (configuration dans caddy/Caddyfile).
  # Certificats Let's Encrypt obtenus et renouvelés par Caddy (volume caddy-data, à garder).
  caddy:
    image: ${IMAGE_REGISTRY:-ghcr.io/philippe-tic}/communeo-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_TERMS_URL: ${VITE_TERMS_URL:-}
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_healthy
      preview:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN}
      # Origine des sites des communes (/sites/<slug>/), derrière le CDN
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN:-origine.communeo.fr}
      # En-tête X-Communeo-Origine ajouté par le CDN (hexadécimal) ; vide : l'origine répond 403 à tout
      SITES_ORIGIN_SECRET: ${SITES_ORIGIN_SECRET:-}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - sites:/srv/sites:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Sauvegardes chaque nuit (deploy/backup) : base (3 jours) et copie miroir des fichiers sur le serveur,
  # historique de 90 jours dans un stockage S3 (chiffré)
  backup:
    image: ${IMAGE_REGISTRY:-ghcr.io/philippe-tic}/communeo-backup:${IMAGE_TAG:-latest}
    build:
      context: deploy/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: strapi
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: strapi
      BACKUP_TIME: ${BACKUP_TIME:-03:15}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-3}
      BACKUP_REMOTE_RETENTION_DAYS: ${BACKUP_REMOTE_RETENTION_DAYS:-90}
      # Copie hors du serveur (facultative mais recommandée) : stockage objet S3 (Scaleway, OVH…)
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-communeo}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Alerte disque : e-mail à l'équipe quand le disque du serveur dépasse le seuil (en %)
      DISK_ALERT_THRESHOLD: ${DISK_ALERT_THRESHOLD:-85}
      DISK_ALERT_TO: ${SIGNUP_NOTIFY_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-noreply@communeo.fr}
    volumes:
      - backups:/backups
      - strapi-uploads:/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  strapi-uploads:
  backups:
  # Certificats et compte ACME de Caddy
  caddy-data:
  caddy-config:
  # Sites des communes publiés par le worker, servis par Caddy
  sites:
