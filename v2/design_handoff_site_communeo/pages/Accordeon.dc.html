<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;border-top:1px solid #D9D6C9;font-family:'DM Sans',sans-serif">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
    <div style="border-bottom:1px solid #D9D6C9">
      <h3 style="margin:0;font-size:inherit">
        <button type="button" id="{{ r.bid }}" aria-expanded="{{ r.exp }}" aria-controls="{{ r.pid }}" onClick="{{ r.toggle }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px;padding:16px 4px;border:none;background:transparent;text-align:left;font:600 clamp(1.0625rem,1rem + .2vw,1.1875rem)/1.4 'DM Sans',sans-serif;color:#1C1B18;cursor:pointer;border-radius:6px" style-hover="color:#0E4033" style-focus="outline:3px solid #0E4033;outline-offset:2px">
          <span>{{ r.q }}</span>
          <span aria-hidden="true" style="flex:none;width:36px;height:36px;border-radius:50%;background:{{ r.chipBg }};display:flex;align-items:center;justify-content:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s;transform:rotate({{ r.rot }}deg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E4033" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>
        </button>
      </h3>
      <div id="{{ r.pid }}" role="region" aria-labelledby="{{ r.bid }}" hidden="{{ r.hidden }}" style="display:grid;grid-template-rows:{{ r.rows }};transition:grid-template-rows .25s cubic-bezier(.2,.8,.2,1)">
        <div style="overflow:hidden"><p style="margin:0;padding:0 56px 22px 4px;max-width:44em;font-size:clamp(1.0625rem,1.039rem + .095vw,1.125rem);line-height:1.6;color:#4A4942;text-wrap:pretty">{{ r.a }}</p></div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:400},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;q&quot;:&quot;Faut-il des compétences en informatique ?&quot;,&quot;a&quot;:&quot;Non.&quot;}],&quot;tsType&quot;:&quot;{q:string,a:string}[]&quot;},&quot;idPrefix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;faq&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: {} };
  renderVals() {
    const items = this.props.items || [];
    const pre = this.props.idPrefix || 'faq';
    return {
      rows: items.map((it, i) => {
        const o = !!this.state.open[i];
        return {
          q: it.q, a: it.a, bid: pre + '-q' + i, pid: pre + '-r' + i,
          exp: o ? 'true' : 'false', rot: o ? 180 : 0, rows: o ? '1fr' : '0fr', hidden: undefined,
          chipBg: o ? '#E1E9E4' : '#EFECE5',
          toggle: () => this.setState(s => ({ open: { ...s.open, [i]: !s.open[i] } }))
        };
      })
    };
  }
}
</script>
</body>
</html>
