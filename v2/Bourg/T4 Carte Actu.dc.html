<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="font-family:'Nunito Sans',system-ui,sans-serif;font-size:17px;line-height:1.5;color:#2E2A26;background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:{{ dir }};height:100%;box-sizing:border-box;border:1px solid #E7DFD5">
  <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="{{ alt }}" style="flex:none;width:{{ imgW }};aspect-ratio:{{ ratio }};background:repeating-linear-gradient(135deg,#E7DFD5 0 10px,#F1EAE1 10px 20px);display:flex;align-items:center;justify-content:center;font:11px ui-monospace,monospace;color:#6B615A">photo · {{ alt }}</div>
  </sc-if>
  <div style="padding:16px 20px 18px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:#6B615A"><span style="display:inline-flex;padding:3px 10px;border-radius:999px;background:{{ chipBg }};color:{{ chipFg }};font-weight:800"><sc-if value="{{ isUrgent }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">! </span></sc-if>{{ cat }}</span><time>{{ date }}</time></div>
    <h3 style="margin:0;font-family:'Nunito',sans-serif;font-size:{{ titleSize }};line-height:1.25;font-weight:800;text-wrap:pretty"><a href="#" style="color:#2E2A26;text-decoration:none" style-hover="color:#1F6F6B;text-decoration:underline">{{ title }}</a></h3>
    <sc-if value="{{ hasSummary }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:16px;color:#6B615A">{{ summary }}</p></sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:380},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Titre&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 sept. 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Actualité&quot;,&quot;Événement&quot;,&quot;Information&quot;,&quot;Urgence&quot;],&quot;default&quot;:&quot;Actualité&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;illustration&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;featured&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;column&quot;,&quot;row&quot;],&quot;default&quot;:&quot;column&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, cat = p.cat ?? 'Actualité', urgent = cat === 'Urgence', row = p.layout === 'row';
    const chips = { 'Actualité': ['#DCEBE2', '#174D4A'], 'Événement': ['#E6E0F3', '#4A3B7A'], 'Information': ['#DCE9F5', '#2E5C8A'], 'Urgence': ['#B23A3A', '#fff'] };
    const [chipBg, chipFg] = chips[cat] ?? chips['Actualité'];
    return { hasImage: p.image !== false, alt: p.alt ?? 'illustration', isUrgent: urgent, cat, chipBg, chipFg, date: p.date ?? '12 sept. 2026', title: p.title ?? 'Titre', hasSummary: !!p.summary, summary: p.summary ?? '', titleSize: p.featured ? '28px' : '20px', dir: row ? 'row' : 'column', imgW: row ? '140px' : '100%', ratio: row ? 'auto' : '16/9' };
  }
}
</script>
</body>
</html>
