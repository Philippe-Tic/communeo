<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;z-index:20;background:#0E4033;font-family:'DM Sans',sans-serif">
  <a href="#contenu" style="position:absolute;left:16px;top:-100px;z-index:30;padding:12px 18px;border-radius:10px;background:#EFECE5;color:#0E4033;font-size:17px;font-weight:600;text-decoration:underline" style-focus="top:12px;outline:3px solid #E3B55B;outline-offset:2px">Aller au contenu</a>
  <div style="max-width:1440px;margin:0 auto;padding:20px clamp(20px,4.4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Accueil.dc.html" aria-label="Communeo, retour à l’accueil" style="display:block;flex:none;border-radius:6px;padding:4px 0" style-focus="outline:3px solid #E3B55B;outline-offset:4px">
      <span style="display:block;width:clamp(138px,12vw,172px);aspect-ratio:538/70;background:#EFECE5;-webkit-mask:url(assets/logo-communeo.svg) center/contain no-repeat;mask:url(assets/logo-communeo.svg) center/contain no-repeat"></span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Navigation principale" style="display:flex;gap:clamp(18px,2.2vw,34px);font-size:17px;font-weight:500">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="color:#EFECE5;text-decoration:{{ n.deco }};text-decoration-color:#E3B55B;text-decoration-thickness:2px;text-underline-offset:8px;padding:10px 0;border-radius:4px;white-space:nowrap" style-hover="text-decoration:underline;text-decoration-color:#EFECE5" style-focus="outline:3px solid #E3B55B;outline-offset:3px">{{ n.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:22px">
        <a href="https://app.communeo.fr/connexion" style="font-size:17px;font-weight:500;color:#EFECE5;padding:10px 0;border-radius:4px;white-space:nowrap" style-focus="outline:3px solid #E3B55B;outline-offset:3px">Se connecter</a>
        <a href="https://app.communeo.fr/inscription" style="display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:10px;background:#EFECE5;color:#0E4033;font-size:17px;font-weight:600;text-decoration:none;transition:background .2s;white-space:nowrap" style-hover="background:#FFFFFF" style-focus="outline:3px solid #E3B55B;outline-offset:3px">Essayer gratuitement</a>
      </div>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-expanded="{{ ariaOpen }}" aria-controls="menu-mobile" onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid #EFECE5;background:transparent;color:#EFECE5;font:600 16px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap" style-focus="outline:3px solid #E3B55B;outline-offset:3px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="{{ menuIcon }}"></path></svg>{{ menuLabel }}
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav id="menu-mobile" aria-label="Navigation principale" style="padding:8px 20px 28px;display:flex;flex-direction:column;border-top:1px solid #155C4A">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" aria-current="{{ n.aria }}" style="display:flex;align-items:center;min-height:56px;border-bottom:1px solid #155C4A;color:#EFECE5;font-size:19px;font-weight:500;text-decoration:{{ n.deco }};text-decoration-color:#E3B55B;text-underline-offset:6px;white-space:nowrap" style-focus="outline:3px solid #E3B55B;outline-offset:2px">{{ n.label }}</a>
      </sc-for>
      <a href="https://app.communeo.fr/connexion" style="display:flex;align-items:center;min-height:56px;color:#EFECE5;font-size:19px;white-space:nowrap" style-focus="outline:3px solid #E3B55B">Se connecter</a>
      <a href="https://app.communeo.fr/inscription" style="display:flex;justify-content:center;align-items:center;min-height:54px;margin-top:8px;border-radius:10px;background:#EFECE5;color:#0E4033;font-size:17px;font-weight:600;text-decoration:none;white-space:nowrap" style-focus="outline:3px solid #E3B55B;outline-offset:3px">Essayer gratuitement 30 jours</a>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;fonctionnalites&quot;,&quot;themes&quot;,&quot;tarifs&quot;,&quot;comment&quot;,&quot;questions&quot;],&quot;default&quot;:&quot;accueil&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobile: typeof window !== 'undefined' && window.innerWidth < 1240, open: false };
  componentDidMount() {
    this.onResize = () => { const m = window.innerWidth < 1240; if (m !== this.state.mobile) this.setState({ mobile: m, open: false }); };
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const cur = this.props.current;
    const items = [
      ['fonctionnalites', 'Fonctionnalités', 'Fonctionnalites.dc.html'],
      ['themes', 'Thèmes', 'Themes.dc.html'],
      ['tarifs', 'Tarifs', 'Tarifs.dc.html'],
      ['comment', 'Comment ça marche', 'Comment-ca-marche.dc.html'],
      ['questions', 'Questions', 'Questions.dc.html']
    ];
    const open = this.state.open;
    return {
      nav: items.map(([k, label, href]) => ({ label, href, aria: k === cur ? 'page' : undefined, deco: k === cur ? 'underline' : 'none' })),
      desktop: !this.state.mobile, mobile: this.state.mobile,
      menuOpen: this.state.mobile && open, ariaOpen: open ? 'true' : 'false',
      menuLabel: open ? 'Fermer' : 'Menu',
      menuIcon: open ? 'M18 6 6 18M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16',
      toggle: () => this.setState(s => ({ open: !s.open }))
    };
  }
}
</script>
</body>
</html>
