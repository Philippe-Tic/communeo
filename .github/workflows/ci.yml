name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    # File des builds (pg-boss) : tests du worker et du dépôt des demandes de mise en ligne
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_QUEUE_DATABASE_URL: postgres://postgres:test@localhost:5432/queue
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm turbo run lint typecheck test --cache-dir=.turbo

      - name: Types Strapi à jour
        run: |
          pnpm gen:types
          git diff --exit-code packages/core/src/generated || (echo "::error::Types Strapi obsolètes : lancer 'pnpm gen:types' et commiter le résultat." && exit 1)

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      - run: pnpm turbo run build --cache-dir=.turbo

  themes:
    name: Thèmes (accessibilité, parité statique / serveur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter "@communeo/renderer^..."

      - run: pnpm --filter @communeo/renderer exec playwright install --with-deps chromium

      - name: Accessibilité de toutes les pages (axe, WCAG 2.2 AA) en 390 et 1440 px
        run: pnpm --filter @communeo/renderer test:e2e

      - name: Parité build statique / mode serveur
        run: pnpm --filter @communeo/renderer test:parity

      - name: Accès à la preview (jetons signés)
        run: pnpm --filter @communeo/renderer test:preview

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: apps/renderer/test-results
          retention-days: 7

  admin:
    name: Admin (accessibilité, clavier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter "@communeo/admin..."

      - run: pnpm --filter @communeo/admin exec playwright install --with-deps chromium

      - name: Shell et écrans de l'admin (axe WCAG 2.2 AA, clavier) en 1440, 1366 et 390 px
        run: pnpm --filter @communeo/admin exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright-admin
          path: apps/admin/test-results
          retention-days: 7

  docker:
    name: Image Docker (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, worker, renderer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
