<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;overflow:hidden;background:#0E4033;font-family:'DM Sans',sans-serif">
  <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 1440 480" preserveAspectRatio="xMaxYMid slice" style="position:absolute;inset:0"><path d="{{ topo }}" fill="none" stroke="#86C2AE" stroke-width="1.2" opacity=".16"></path></svg>
  <div style="position:relative;max-width:1440px;margin:0 auto;padding:clamp(40px,6vw,88px) clamp(20px,4.4vw,64px) clamp(56px,7vw,104px);display:flex;flex-direction:column;gap:20px">
    <span style="font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E3B55B">{{ kicker }}</span>
    <h1 id="contenu" tabindex="-1" style="margin:0;max-width:17em;font:400 clamp(2.5rem,1.757rem + 3.048vw,4.5rem)/1.04 'DM Serif Display',Georgia,serif;letter-spacing:-.01em;color:#EFECE5;text-wrap:balance;outline:none">{{ title }}</h1>
    <sc-if value="{{ hasLead }}" hint-placeholder-val="{{ true }}">
      <p style="margin:0;max-width:36em;font-size:clamp(1.25rem,1.157rem + .381vw,1.5rem);line-height:1.5;color:#EFECE5;text-wrap:pretty">{{ lead }}</p>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tarifs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Un prix clair, selon la taille de votre commune.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0.4,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    if (!this.topo) {
      let d = ''; const cx = 1200, cy = 300, seed = (this.props.seed ?? 0.4);
      for (let i = 0; i < 12; i++) {
        const r = 40 + i * 58;
        for (let k = 0; k <= 120; k++) {
          const a = k / 120 * Math.PI * 2;
          const rr = r * (1 + .12 * Math.sin(3 * a + seed) + .05 * Math.sin(5 * a + seed * 2)) + 10 * Math.sin(2 * a + seed + i * .35);
          d += (k ? 'L' : 'M') + (cx + rr * Math.cos(a) * 1.35).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
        }
        d += 'Z';
      }
      this.topo = d;
    }
    return { topo: this.topo, kicker: this.props.kicker, title: this.props.title, lead: this.props.lead, hasLead: !!this.props.lead };
  }
}
</script>
</body>
</html>
