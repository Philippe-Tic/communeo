<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="font-family:'Source Sans 3',system-ui,sans-serif;font-size:18px;line-height:1.5;color:#1C2321;background:#fff;border:1px solid #CFD4CF;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;height:100%">
  <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="{{ alt }}" style="aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#E3E7E2 0 10px,#EEF1ED 10px 20px);display:flex;align-items:center;justify-content:center;font:12px ui-monospace,monospace;color:#4A5350">photo · {{ alt }}</div>
  </sc-if>
  <div style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px">
      <sc-if value="{{ isUrgent }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:3px;background:#8B1A1A;color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.03em"><span aria-hidden="true">!</span>Urgence</span></sc-if>
      <sc-if value="{{ notUrgent }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;padding:2px 10px;border-radius:3px;background:#E3EFE7;color:#143D29;font-weight:600">{{ cat }}</span></sc-if>
      <time style="color:#4A5350">{{ date }}</time>
    </div>
    <h3 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-size:{{ titleSize }};line-height:1.25;font-weight:600;text-wrap:pretty"><a href="#" style="color:#1C2321;text-decoration:none" style-hover="text-decoration:underline">{{ title }}</a></h3>
    <sc-if value="{{ hasSummary }}" hint-placeholder-val="{{ true }}"><p style="margin:0;color:#4A5350;font-size:17px">{{ summary }}</p></sc-if>
    <span style="margin-top:auto;padding-top:6px;color:#1F5A3C;font-weight:600;text-decoration:underline;text-underline-offset:3px">Lire la suite<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"> : {{ title }}</span></span>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:420},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Titre de l'actualité&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 septembre 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Actualité&quot;,&quot;Événement&quot;,&quot;Information&quot;,&quot;Urgence&quot;],&quot;default&quot;:&quot;Actualité&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;illustration&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;featured&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { hasImage: p.image !== false, alt: p.alt ?? 'illustration', isUrgent: p.cat === 'Urgence', notUrgent: p.cat !== 'Urgence', cat: p.cat ?? 'Actualité', date: p.date ?? '12 septembre 2026', title: p.title ?? 'Titre de l\u2019actualité', hasSummary: !!p.summary, summary: p.summary ?? '', titleSize: p.featured ? '28px' : '21px' };
  }
}
</script>
</body>
</html>
