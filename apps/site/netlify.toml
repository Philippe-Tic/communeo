# Site Netlify de communeo.fr. Réglages du site : « Base directory » vide (racine du monorepo, où
# Netlify installe les dépendances avec pnpm), « Package directory » = apps/site (ce fichier).
[build]
  command = "pnpm turbo run build --filter @communeo/site..."
  publish = "apps/site/dist"
  # Pas de build (ni d'aperçu de PR) quand le commit ne touche ni le site, ni ce qui construit sa
  # démonstration (/demo, #359 : renderer, thèmes, fixtures et leurs paquets), ni @communeo/core (tarifs),
  # ni les dépendances ou la config du monorepo : une mise à jour de Strapi ou de l'admin n'en déclenche pas.
  # Captures des thèmes : `pnpm captures:themes`, dont le commit déclenche le build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/site apps/renderer themes packages/core packages/fixtures packages/ui-a11y packages/theme-contract pnpm-lock.yaml package.json pnpm-workspace.yaml turbo.json"

[build.environment]
  NODE_VERSION = "24"

# Adresses de l'ancien site (communeo-landing)
[[redirects]]
  from = "/cgv/*"
  to = "/conditions"
  status = 301

[[redirects]]
  from = "/cgv"
  to = "/conditions"
  status = 301

[[redirects]]
  from = "/faq/*"
  to = "/questions"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/questions"
  status = 301

[[redirects]]
  from = "/mentions-legales/"
  to = "/mentions-legales"
  status = 301

# Démonstration (#359) : un dossier par thème, l'Institutionnel par défaut
[[redirects]]
  from = "/demo"
  to = "/demo/institutionnel/"
  status = 302

[[redirects]]
  from = "/demo/"
  to = "/demo/institutionnel/"
  status = 302

[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://app.communeo.fr; form-action https://app.communeo.fr; frame-ancestors 'none'; base-uri 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Démonstration (#359) : la commune fictive, jamais indexée. Ses pages chargent la météo (Open-Meteo), une
# vidéo et une carte après consentement, et la recherche (Pagefind, WebAssembly). Placée après la règle
# générale, cette politique la remplace pour /demo.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.open-meteo.com; frame-src https://www.youtube-nocookie.com https://www.openstreetmap.org; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sous-titres des vidéos (lus par le lecteur du navigateur)
[[headers]]
  for = "/_astro/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"
