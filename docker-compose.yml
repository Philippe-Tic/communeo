services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  strapi:
    image: communeo-strapi:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      IS_PROXIED: "true"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      STRAPI_PUBLIC_URL: https://${DOMAIN}
      NETLIFY_TOKEN: ${NETLIFY_TOKEN}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      # Émetteur des devis (#312)
      COMMUNEO_LEGAL_NAME: ${COMMUNEO_LEGAL_NAME:-}
      COMMUNEO_LEGAL_ADDRESS: ${COMMUNEO_LEGAL_ADDRESS:-}
      COMMUNEO_SIRET: ${COMMUNEO_SIRET:-}
      COMMUNEO_BILLING_EMAIL: ${COMMUNEO_BILLING_EMAIL:-}
      COMMUNEO_VAT_RATE: ${COMMUNEO_VAT_RATE:-0}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      # File des builds (schéma pgboss de la même base), traitée par le service worker
      QUEUE_DATABASE_URL: postgres://strapi:${POSTGRES_PASSWORD}@postgres:5432/strapi
      WORKER_SECRET: ${WORKER_SECRET}
      # Jetons de preview signés (même secret côté serveur de preview)
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      PREVIEW_URL: https://${PREVIEW_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_DEFAULT_FROM: ${EMAIL_DEFAULT_FROM:-noreply@communeo.fr}
      ADMIN_URL: https://${DOMAIN}
      DOMAIN: ${DOMAIN}
      # Seed initial admin (first boot only, optional)
      SEED_SITE_NAME: ${SEED_SITE_NAME:-}
      SEED_SITE_SLUG: ${SEED_SITE_SLUG:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
    volumes:
      - strapi-uploads:/app/public/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: communeo-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      strapi:
        condition: service_started
    environment:
      QUEUE_DATABASE_URL: postgres://strapi:${POSTGRES_PASSWORD}@postgres:5432/strapi
      STRAPI_URL: http://strapi:1337
      STRAPI_PUBLIC_URL: https://${DOMAIN}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      WORKER_SECRET: ${WORKER_SECRET}
      NETLIFY_TOKEN: ${NETLIFY_TOKEN}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  preview:
    image: communeo-preview:latest
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_started
    environment:
      STRAPI_URL: http://strapi:1337
      STRAPI_PUBLIC_URL: https://${DOMAIN}
      # Lecture seule, brouillons compris (« Preview Token » créé au premier démarrage de Strapi)
      STRAPI_TOKEN: ${PREVIEW_API_TOKEN}
      # Vérifie les jetons délivrés par Strapi : sans lui, tout répond 401
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      # Affichée dans le panneau de preview de l'administration seulement
      PREVIEW_FRAME_ANCESTORS: https://${DOMAIN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - strapi
      - preview
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN}
      # Seuls DOMAIN et PREVIEW_DOMAIN sont substitués dans les templates, les variables nginx ($host etc.) sont préservées
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./apps/admin/dist:/usr/share/nginx/html:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres-data:
  strapi-uploads:
  certbot-webroot:
  certbot-certs:
