<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="font-family:'Public Sans',system-ui,sans-serif;font-size:17px;line-height:1.5;color:#1B2430;display:flex;gap:16px;padding:16px 0;border-top:1px solid #D3DAE3;height:100%;box-sizing:border-box;flex-direction:{{ dir }}">
  <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="{{ alt }}" style="flex:none;width:{{ imgW }};aspect-ratio:{{ ratio }};border-radius:4px;background:repeating-linear-gradient(135deg,#D3DAE3 0 10px,#E4EBF4 10px 20px);display:flex;align-items:center;justify-content:center;font:11px ui-monospace,monospace;color:#52606D">photo</div>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:#52606D"><span style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:{{ catColor }}"><sc-if value="{{ isUrgent }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">! </span></sc-if>{{ cat }}</span><time>{{ date }}</time></div>
    <h3 style="margin:0;font-family:'Lora',Georgia,serif;font-size:{{ titleSize }};line-height:1.25;font-weight:600;text-wrap:pretty"><a href="#" style="color:#1B2430;text-decoration:none" style-hover="color:#2B4C7E;text-decoration:underline">{{ title }}</a></h3>
    <sc-if value="{{ hasSummary }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:16px;color:#52606D">{{ summary }}</p></sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:160},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Titre&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 septembre 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Actualité&quot;,&quot;Événement&quot;,&quot;Information&quot;,&quot;Urgence&quot;],&quot;default&quot;:&quot;Actualité&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;illustration&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;featured&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, cat = p.cat ?? 'Actualité', urgent = cat === 'Urgence', big = !!p.featured;
    return { hasImage: p.image !== false, alt: p.alt ?? 'illustration', isUrgent: urgent, cat, catColor: urgent ? '#A5341F' : '#2B4C7E', date: p.date ?? '12 septembre 2026', title: p.title ?? 'Titre', hasSummary: !!p.summary, summary: p.summary ?? '', titleSize: big ? '30px' : '20px', dir: big ? 'column' : 'row', imgW: big ? '100%' : '120px', ratio: big ? '16/9' : '4/3' };
  }
}
</script>
</body>
</html>
