# Surcharge pour le test de bout en bout de la stack de production (deploy/e2e/run.sh, CI) : mêmes images,
# sans TLS ni Netlify (publication dans un dossier), un super admin de test.
#   docker compose --env-file deploy/e2e/e2e.env -f docker-compose.yml -f deploy/e2e/compose.e2e.yml up -d
name: communeo-e2e

services:
  nginx:
    ports: !override
      - "127.0.0.1:${E2E_PORT:-8088}:80"
    volumes: !override
      - ./deploy/e2e/nginx:/etc/nginx/templates:ro

  certbot:
    profiles: [disabled]

  strapi:
    environment:
      STRAPI_PUBLIC_URL: http://localhost:${E2E_PORT:-8088}
      ADMIN_URL: http://localhost:${E2E_PORT:-8088}
      NETLIFY_TOKEN: ""
      RESEND_API_KEY: ""
      SEED_SUPER_ADMIN_EMAIL: equipe@communeo.test
      SEED_SUPER_ADMIN_PASSWORD: ${E2E_SUPER_PASSWORD}

  # Stockage objet S3 de test (sauvegardes hors du serveur)
  s3:
    image: rclone/rclone:1.71
    command: serve s3 /data --addr :9000 --auth-key e2e-access-key,e2e-secret-key

  backup:
    depends_on:
      s3:
        condition: service_started
    environment:
      BACKUP_S3_BUCKET: communeo-e2e
      BACKUP_PASSPHRASE: e2e-passphrase
      RCLONE_CONFIG_REMOTE_PROVIDER: Rclone
      RCLONE_CONFIG_REMOTE_ENDPOINT: http://s3:9000
      RCLONE_CONFIG_REMOTE_REGION: us-east-1
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: e2e-access-key
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: e2e-secret-key

  worker:
    environment:
      NETLIFY_TOKEN: ""
      PUBLISH_DIR: /app/published
      PUBLISH_BASE_URL: http://localhost:${E2E_PORT:-8088}/sites
    volumes:
      - published:/app/published

volumes:
  published:
