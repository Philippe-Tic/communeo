<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<div style="font-family:'Public Sans',system-ui,sans-serif;font-size:17px;line-height:1.5;color:#1B2430">
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Navigation principale" style="width:280px;min-height:100%;box-sizing:border-box;background:#1B2430;color:#fff;padding:28px 24px 32px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;align-self:stretch;min-height:100%">
      <a href="#" style="display:flex;flex-direction:column;gap:12px;text-decoration:none;color:#fff"><div style="width:180px;height:48px;border:1px dashed #8A96A6;border-radius:4px;background:repeating-linear-gradient(135deg,#2A3646 0 6px,#232E3D 6px 12px);display:flex;align-items:center;justify-content:center;font:11px ui-monospace,monospace;color:#B8C2D0">logo horizontal</div><span style="font-family:'Lora',Georgia,serif;font-size:22px;font-weight:600;line-height:1.15">Saint-Aubin-sur-Loire</span></a>
      <form style="display:flex;margin:0"><label for="t3q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Rechercher sur le site</label><input id="t3q" type="search" placeholder="Rechercher…" style="flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid #52606D;border-right:none;border-radius:4px 0 0 4px;font:inherit;font-size:16px;background:#232E3D;color:#fff"><button type="submit" aria-label="Lancer la recherche" style="width:48px;height:48px;border:1px solid #52606D;border-radius:0 4px 4px 0;background:#2B4C7E;color:#fff;font:inherit;cursor:pointer"><span aria-hidden="true" style="display:inline-block;width:14px;height:14px;border:2.5px solid #fff;border-radius:50%"></span></button></form>
      <ul style="list-style:none;margin:0;padding:0;display:grid;gap:2px">
        <li><a href="#" aria-current="{{ cur.accueil }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.accueil }};border-left:3px solid {{ bd.accueil }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 10v11h14V10M10 21v-6h4v6"/></svg>Accueil</a></li>
        <li><a href="#" aria-current="{{ cur.actus }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.actus }};border-left:3px solid {{ bd.actus }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13v16H4zM17 8h3v10a2 2 0 0 1-2 2M7 8h7M7 12h7M7 16h4"/></svg>Actualités</a></li>
        <li><a href="#" aria-current="{{ cur.agenda }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.agenda }};border-left:3px solid {{ bd.agenda }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a></li>
        <li><a href="#" aria-current="{{ cur.demarches }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.demarches }};border-left:3px solid {{ bd.demarches }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h6"/></svg>Démarches</a></li>
        <li><a href="#" aria-current="{{ cur.mairie }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.mairie }};border-left:3px solid {{ bd.mairie }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M4 10h16M12 3 3 9h18l-9-6zM6 10v11M10 10v11M14 10v11M18 10v11"/></svg>Mairie</a></li>
        <li><a href="#" aria-current="{{ cur.vivre }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.vivre }};border-left:3px solid {{ bd.vivre }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c.8-3.5 3.2-5.5 6.5-5.5s5.7 2 6.5 5.5M15.5 14.6c2.6.2 4.6 1.7 5.5 4.4"/></svg>Vivre ici</a></li>
        <li><a href="#" aria-current="{{ cur.contact }}" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0 14px;border-radius:4px;color:#fff;text-decoration:none;font-weight:600;background:{{ bg.contact }};border-left:3px solid {{ bd.contact }}"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Contact</a></li>
      </ul>
      <div style="margin-top:auto;padding-top:20px;border-top:1px solid #34404F;font-size:15px;line-height:1.5;color:#D3DAE3"><p style="margin:0;display:flex;align-items:center;gap:8px;font-weight:600;color:#fff"><span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#6FCF97;display:inline-block"></span>Mairie ouverte · ferme à 12h</p><p style="margin:8px 0 0">1 place de la Mairie<br><a href="tel:0241000000" style="color:#fff;font-weight:600">02 41 00 00 00</a></p><p style="margin:8px 0 0"><a href="#" style="color:#B8C2D0">Accessibilité : partiellement conforme</a></p></div>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobileTop }}" hint-placeholder-val="{{ false }}">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:#1B2430;color:#fff"><a href="#" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0"><div style="width:84px;height:30px;flex:none;border:1px dashed #8A96A6;border-radius:4px;background:repeating-linear-gradient(135deg,#2A3646 0 6px,#232E3D 6px 12px);display:flex;align-items:center;justify-content:center;font:9px ui-monospace,monospace;color:#B8C2D0">logo</div><span style="font-family:'Lora',Georgia,serif;font-size:17px;font-weight:600;line-height:1.1">Saint-Aubin-sur-Loire</span></a><button aria-label="Rechercher" style="flex:none;width:44px;height:44px;border:none;border-radius:4px;background:#2B4C7E;color:#fff;display:inline-flex;align-items:center;justify-content:center"><span aria-hidden="true" style="display:inline-block;width:14px;height:14px;border:2.5px solid #fff;border-radius:50%"></span></button></header>
  </sc-if>
  <sc-if value="{{ isMobileTabs }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Navigation principale" style="position:sticky;bottom:0;background:#fff;border-top:1px solid #D3DAE3;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 10px">
      <a href="#" aria-current="{{ cur.accueil }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 0;text-decoration:none;color:{{ tab.accueil }};font-size:12px;font-weight:600;border-top:3px solid {{ tabbd.accueil }};margin-top:-7px;padding-top:9px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M5 10v11h14V10M10 21v-6h4v6"/></svg>Accueil</a>
      <a href="#" aria-current="{{ cur.actus }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 0;text-decoration:none;color:{{ tab.actus }};font-size:12px;font-weight:600;border-top:3px solid {{ tabbd.actus }};margin-top:-7px;padding-top:9px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13v16H4zM17 8h3v10a2 2 0 0 1-2 2M7 8h7M7 12h7M7 16h4"/></svg>Actualités</a>
      <a href="#" aria-current="{{ cur.agenda }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 0;text-decoration:none;color:{{ tab.agenda }};font-size:12px;font-weight:600;border-top:3px solid {{ tabbd.agenda }};margin-top:-7px;padding-top:9px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
      <a href="#" aria-current="{{ cur.demarches }}" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 0;text-decoration:none;color:{{ tab.demarches }};font-size:12px;font-weight:600;border-top:3px solid {{ tabbd.demarches }};margin-top:-7px;padding-top:9px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h6"/></svg>Démarches</a>
      <button aria-expanded="false" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:9px 0 6px;border:none;border-top:3px solid transparent;margin-top:-7px;background:transparent;color:#52606D;font:600 12px 'Public Sans',sans-serif"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:900},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile-top&quot;,&quot;mobile-tabs&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;actus&quot;,&quot;agenda&quot;,&quot;demarches&quot;,&quot;mairie&quot;,&quot;vivre&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;accueil&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, mode = p.mode ?? 'desktop', active = p.active ?? 'accueil';
    const keys = ['accueil','actus','agenda','demarches','mairie','vivre','contact'];
    const cur = {}, bg = {}, bd = {}, tab = {}, tabbd = {};
    keys.forEach(k => { const on = k === active; cur[k] = on ? 'page' : undefined; bg[k] = on ? '#2B4C7E' : 'transparent'; bd[k] = on ? '#9EC1EA' : 'transparent'; tab[k] = on ? '#2B4C7E' : '#52606D'; tabbd[k] = on ? '#2B4C7E' : 'transparent'; });
    return { isDesktop: mode === 'desktop', isMobileTop: mode === 'mobile-top', isMobileTabs: mode === 'mobile-tabs', cur, bg, bd, tab, tabbd };
  }
}
</script>
</body>
</html>
