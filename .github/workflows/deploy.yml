name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-admin:
    name: Build admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 1

  build-strapi:
    name: Build Strapi Docker image
    needs: build-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t communeo-strapi:latest ./backend

      - name: Save Docker image as tarball
        run: docker save communeo-strapi:latest | gzip > /tmp/communeo-strapi.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: strapi-image
          path: /tmp/communeo-strapi.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: [build-admin, build-strapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: strapi-image
          path: image/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload admin build via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/communeo/admin/dist/

      - name: Transfer Docker image to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            image/communeo-strapi.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/communeo-strapi.tar.gz

      - name: Load image and deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/communeo
            git pull origin main
            docker load < /tmp/communeo-strapi.tar.gz
            rm /tmp/communeo-strapi.tar.gz
            docker compose up -d --force-recreate
          EOF

      - name: Health check
        run: |
          echo "Waiting 30s for Strapi to boot..."
          sleep 30
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://app.communeo.fr/ || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1
