<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .building { fill: #1f2937; }
      .flag { fill: #3b82f6; }
      .door { fill: #ffffff; }
    </style>
  </defs>

  <!-- Bâtiment principal -->
  <rect class="building" x="20" y="40" width="60" height="45"/>

  <!-- Toit -->
  <polygon class="building" points="15,40 50,20 85,40"/>

  <!-- Porte -->
  <rect class="door" x="40" y="60" width="20" height="25"/>

  <!-- Drapeau -->
  <rect class="building" x="48" y="20" width="4" height="20"/>
  <rect class="flag" x="52" y="20" width="15" height="10"/>

  <!-- Fenêtres -->
  <rect class="door" x="25" y="45" width="8" height="8"/>
  <rect class="door" x="35" y="45" width="8" height="8"/>
  <rect class="door" x="57" y="45" width="8" height="8"/>
  <rect class="door" x="67" y="45" width="8" height="8"/>
</svg>
